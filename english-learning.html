<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnglishGo — 英文學習</title>
<style>
:root {
  --green: #58CC02;
  --green-dark: #46A302;
  --green-light: #D7FFB8;
  --blue: #1CB0F6;
  --blue-dark: #0095D9;
  --red: #FF4B4B;
  --red-light: #FFE0E0;
  --yellow: #FFC800;
  --purple: #CE82FF;
  --orange: #FF9600;
  --gray-50: #F7F7F7;
  --gray-100: #EBEBEB;
  --gray-200: #E5E5E5;
  --gray-400: #AFAFAF;
  --gray-600: #777;
  --gray-900: #3C3C3C;
  --white: #FFFFFF;
  --radius: 12px;
  --shadow: 0 2px 0 rgba(0,0,0,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', -apple-system, 'Microsoft JhengHei', sans-serif;
  background: var(--gray-50);
  color: var(--gray-900);
  min-height: 100vh;
}

/* ── Screen visibility ── */
.screen { display: none; }
.screen.active { display: block; }

/* ────────────────────────────
   HOME SCREEN
──────────────────────────── */
.home-header {
  background: var(--white);
  border-bottom: 2px solid var(--gray-200);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-owl { font-size: 32px; }
.logo-text { font-size: 20px; font-weight: 900; color: var(--green); letter-spacing: -0.5px; }

.stats-row { display: flex; align-items: center; gap: 16px; }
.stat-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 15px; font-weight: 800;
  padding: 6px 12px;
  border-radius: 8px;
  border: 2px solid var(--gray-200);
  background: var(--white);
  user-select: none;
}
.stat-chip .sc-icon { font-size: 18px; }
.stat-chip.streak { color: var(--orange); border-color: var(--orange); }
.stat-chip.xp { color: var(--yellow); border-color: var(--yellow); }
.stat-chip.hearts { color: var(--red); border-color: var(--red); }

.home-body { max-width: 480px; margin: 0 auto; padding: 24px 16px 80px; }

.section-label {
  font-size: 13px; font-weight: 700;
  color: var(--gray-600);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 12px; margin-top: 24px;
}

/* Unit cards */
.unit-card {
  background: var(--white);
  border-radius: 16px;
  border: 2px solid var(--gray-200);
  margin-bottom: 12px;
  overflow: hidden;
  transition: transform .1s, box-shadow .1s;
  cursor: pointer;
}
.unit-card:not(.locked):hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.unit-card.locked { opacity: .55; cursor: not-allowed; }
.unit-header {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px;
}
.unit-emoji {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}
.unit-info { flex: 1; }
.unit-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.unit-sub { font-size: 12px; color: var(--gray-600); }
.unit-badge {
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
}
.badge-done { background: var(--green-light); color: var(--green-dark); }
.badge-new { background: #E8F4FF; color: var(--blue-dark); }
.badge-lock { background: var(--gray-100); color: var(--gray-400); }

.unit-progress-bar {
  height: 8px; background: var(--gray-100);
}
.unit-progress-fill { height: 100%; background: var(--green); transition: width .4s; }

.start-btn {
  display: block;
  width: calc(100% - 32px);
  margin: 0 16px 16px;
  padding: 14px;
  border: none;
  border-radius: var(--radius);
  font-size: 15px; font-weight: 800;
  color: var(--white);
  background: var(--green);
  box-shadow: 0 4px 0 var(--green-dark);
  cursor: pointer;
  transition: all .1s;
  font-family: inherit;
  letter-spacing: .3px;
}
.start-btn:hover { background: var(--green-dark); }
.start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
.start-btn:disabled { background: var(--gray-400); box-shadow: 0 4px 0 #999; cursor: not-allowed; }

/* ────────────────────────────
   LESSON SCREEN
──────────────────────────── */
.lesson-header {
  background: var(--white);
  padding: 14px 16px 12px;
  border-bottom: 2px solid var(--gray-200);
  display: flex; align-items: center; gap: 12px;
}
.close-btn {
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  color: var(--gray-600); padding: 4px;
  border-radius: 8px; transition: background .1s;
  font-family: inherit;
}
.close-btn:hover { background: var(--gray-100); }

.progress-track { flex: 1; height: 16px; background: var(--gray-200); border-radius: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 8px; transition: width .4s ease; }

.hearts-display { font-size: 16px; letter-spacing: 3px; }

/* Exercise area */
.exercise-wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 120px; }

.q-label { font-size: 12px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.q-text { font-size: 22px; font-weight: 800; margin-bottom: 8px; line-height: 1.4; }
.q-sub { font-size: 15px; color: var(--gray-600); margin-bottom: 24px; }

/* Translate type: show Chinese, pick English */
.options-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 16px;
}
.option-btn {
  padding: 14px 12px;
  border: 2px solid var(--gray-200);
  background: var(--white);
  border-radius: var(--radius);
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  transition: all .12s;
  font-family: inherit;
  color: var(--gray-900);
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  box-shadow: 0 2px 0 var(--gray-200);
  min-height: 70px; justify-content: center;
  text-align: center;
}
.option-btn:hover:not(:disabled) { border-color: var(--blue); background: #EEF9FF; box-shadow: 0 2px 0 var(--blue); }
.option-btn.selected { border-color: var(--blue); background: #EEF9FF; box-shadow: 0 2px 0 var(--blue); }
.option-btn.correct { border-color: var(--green); background: var(--green-light); box-shadow: 0 2px 0 var(--green-dark); color: var(--green-dark); }
.option-btn.wrong { border-color: var(--red); background: var(--red-light); box-shadow: 0 2px 0 #cc0000; color: var(--red); }
.option-btn:disabled { cursor: default; }
.opt-emoji { font-size: 24px; }
.opt-text { font-size: 14px; font-weight: 700; }

/* Word-arrange type */
.sentence-slots {
  min-height: 56px; background: var(--white);
  border: 2px solid var(--gray-200); border-bottom: 4px solid var(--gray-200);
  border-radius: var(--radius); padding: 10px 12px;
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 20px; cursor: text;
}
.slot-placeholder { color: var(--gray-400); font-size: 14px; align-self: center; }

.word-bank {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 16px;
}
.word-chip {
  padding: 8px 14px;
  border: 2px solid var(--gray-200);
  border-bottom: 4px solid var(--gray-200);
  background: var(--white);
  border-radius: 10px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: all .1s;
  font-family: inherit;
  color: var(--gray-900);
}
.word-chip:hover:not(.used):not(.in-slot) { border-color: var(--blue); background: #EEF9FF; }
.word-chip.used { opacity: .3; cursor: not-allowed; }
.word-chip.in-slot {
  border-color: var(--blue); background: #EEF9FF;
  border-bottom-color: var(--blue-dark);
  cursor: pointer;
}
.word-chip.correct { border-color: var(--green); background: var(--green-light); border-bottom-color: var(--green-dark); color: var(--green-dark); cursor: default; }
.word-chip.wrong { border-color: var(--red); background: var(--red-light); border-bottom-color: #cc0000; color: var(--red); cursor: default; }

/* Tap-translate type: tap card to hear */
.listen-card {
  text-align: center; padding: 32px 24px;
  background: var(--white); border: 2px solid var(--gray-200);
  border-radius: 20px; margin-bottom: 20px; cursor: pointer;
  transition: all .15s;
}
.listen-card:hover { border-color: var(--blue); transform: scale(1.02); }
.listen-icon { font-size: 48px; margin-bottom: 8px; }
.listen-text { font-size: 32px; font-weight: 900; color: var(--gray-900); }
.listen-hint { font-size: 13px; color: var(--gray-600); margin-top: 6px; }

/* Feedback bar */
.feedback-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 16px 24px 24px;
  display: none;
  align-items: center; gap: 16px;
  z-index: 200;
  border-top: 2px solid transparent;
}
.feedback-bar.correct { background: var(--green-light); border-color: var(--green); }
.feedback-bar.wrong { background: var(--red-light); border-color: var(--red); }
.feedback-icon { font-size: 28px; }
.feedback-content { flex: 1; }
.feedback-title { font-size: 17px; font-weight: 900; }
.feedback-bar.correct .feedback-title { color: var(--green-dark); }
.feedback-bar.wrong .feedback-title { color: var(--red); }
.feedback-sub { font-size: 13px; margin-top: 3px; }
.feedback-bar.correct .feedback-sub { color: var(--green-dark); }
.feedback-bar.wrong .feedback-sub { color: var(--red); }
.next-btn {
  padding: 14px 28px;
  border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 800;
  cursor: pointer; font-family: inherit;
  transition: all .1s;
  box-shadow: var(--shadow);
  white-space: nowrap;
}
.feedback-bar.correct .next-btn { background: var(--green); color: var(--white); box-shadow: 0 4px 0 var(--green-dark); }
.feedback-bar.wrong .next-btn { background: var(--red); color: var(--white); box-shadow: 0 4px 0 #cc0000; }
.next-btn:active { transform: translateY(2px); }

/* Check button (floating) */
.check-area {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 16px 24px 24px;
  background: linear-gradient(transparent, var(--gray-50) 30%);
}
.check-btn {
  display: block; width: 100%; max-width: 480px;
  margin: 0 auto;
  padding: 16px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 800;
  cursor: pointer; font-family: inherit;
  transition: all .1s;
}
.check-btn.active { background: var(--green); color: var(--white); box-shadow: 0 4px 0 var(--green-dark); }
.check-btn.active:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
.check-btn.inactive { background: var(--gray-200); color: var(--gray-600); box-shadow: 0 4px 0 #ccc; cursor: not-allowed; }

/* ────────────────────────────
   COMPLETE SCREEN
──────────────────────────── */
#screen-complete {
  min-height: 100vh;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  background: var(--white);
}
#screen-complete.active { display: flex; }

.complete-owl { font-size: 80px; margin-bottom: 12px; animation: bounce 0.6s ease infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
.complete-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
.complete-sub { font-size: 16px; color: var(--gray-600); margin-bottom: 32px; }

.xp-gained {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--yellow); border-radius: 16px;
  padding: 14px 28px;
  font-size: 24px; font-weight: 900;
  margin-bottom: 32px;
  box-shadow: 0 4px 0 #cc9f00;
}
.xp-gained .xp-icon { font-size: 28px; }

.stats-complete {
  display: flex; gap: 20px; margin-bottom: 36px;
}
.sc-item {
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 24px;
  border-radius: 14px; border: 2px solid var(--gray-200);
}
.sc-item .sci-val { font-size: 26px; font-weight: 900; }
.sc-item .sci-label { font-size: 12px; color: var(--gray-600); font-weight: 700; margin-top: 4px; }
.sc-item.accuracy .sci-val { color: var(--blue); }
.sc-item.time-spent .sci-val { color: var(--purple); }
.sc-item.xp-earned .sci-val { color: var(--yellow); }

.home-btn {
  display: block; width: 100%; max-width: 320px;
  padding: 16px;
  border: none; border-radius: var(--radius);
  font-size: 17px; font-weight: 800;
  cursor: pointer; font-family: inherit;
  background: var(--green); color: var(--white);
  box-shadow: 0 4px 0 var(--green-dark);
  transition: all .1s;
}
.home-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }

/* ────────────────────────────
   LIVES OUT SCREEN
──────────────────────────── */
#screen-nohearts {
  min-height: 100vh;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  background: var(--white);
}
#screen-nohearts.active { display: flex; }
.broken-heart { font-size: 80px; margin-bottom: 16px; }
.nh-title { font-size: 26px; font-weight: 900; margin-bottom: 10px; color: var(--red); }
.nh-sub { font-size: 15px; color: var(--gray-600); margin-bottom: 32px; line-height: 1.5; }
.refill-btn {
  display: block; width: 100%; max-width: 320px;
  padding: 16px; border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
  background: var(--red); color: var(--white);
  box-shadow: 0 4px 0 #cc0000; transition: all .1s; margin-bottom: 12px;
}
.refill-btn:active { transform: translateY(2px); }

/* ────────────────────────────
   ANIMATIONS
──────────────────────────── */
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.shake { animation: shake .4s ease; }

@keyframes pop {
  0%{transform:scale(1)}
  50%{transform:scale(1.12)}
  100%{transform:scale(1)}
}
.pop { animation: pop .25s ease; }

/* Confetti */
.confetti { position: fixed; top: -10px; pointer-events: none; z-index: 9999; }
.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ── Responsive ── */
@media (max-width: 400px) {
  .options-grid { grid-template-columns: 1fr; }
  .q-text { font-size: 18px; }
  .stats-complete { gap: 10px; }
  .sc-item { padding: 12px 16px; }
}
</style>
</head>
<body>

<!-- ══════ HOME SCREEN ══════ -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <div class="logo">
      <span class="logo-owl">🦉</span>
      <span class="logo-text">EnglishGo</span>
    </div>
    <div class="stats-row">
      <div class="stat-chip streak">
        <span class="sc-icon">🔥</span>
        <span id="stat-streak">0</span>
      </div>
      <div class="stat-chip xp">
        <span class="sc-icon">⚡</span>
        <span id="stat-xp">0</span>
      </div>
      <div class="stat-chip hearts">
        <span id="stat-hearts">❤️❤️❤️</span>
      </div>
    </div>
  </div>
  <div class="home-body" id="homeBody"></div>
</div>

<!-- ══════ LESSON SCREEN ══════ -->
<div id="screen-lesson" class="screen">
  <div class="lesson-header">
    <button class="close-btn" onclick="goHome()">✕</button>
    <div class="progress-track">
      <div class="progress-fill" id="lessonProgress"></div>
    </div>
    <div class="hearts-display" id="lessonHearts"></div>
  </div>
  <div class="exercise-wrap" id="exerciseWrap"></div>
  <div class="check-area" id="checkArea">
    <button class="check-btn inactive" id="checkBtn" onclick="checkAnswer()">確認</button>
  </div>
  <div class="feedback-bar" id="feedbackBar">
    <div class="feedback-icon" id="fbIcon"></div>
    <div class="feedback-content">
      <div class="feedback-title" id="fbTitle"></div>
      <div class="feedback-sub" id="fbSub"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextExercise()">繼續</button>
  </div>
</div>

<!-- ══════ COMPLETE SCREEN ══════ -->
<div id="screen-complete" class="screen">
  <div class="complete-owl">🦉</div>
  <div class="complete-title">太棒了！</div>
  <div class="complete-sub" id="completeSub">你完成了這個課程！</div>
  <div class="xp-gained">
    <span class="xp-icon">⚡</span>
    <span id="xpGained">+10 XP</span>
  </div>
  <div class="stats-complete">
    <div class="sc-item accuracy">
      <span class="sci-val" id="statAcc">—</span>
      <span class="sci-label">正確率</span>
    </div>
    <div class="sc-item time-spent">
      <span class="sci-val" id="statTime">—</span>
      <span class="sci-label">時間</span>
    </div>
    <div class="sc-item xp-earned">
      <span class="sci-val" id="statXP">—</span>
      <span class="sci-label">獲得 XP</span>
    </div>
  </div>
  <button class="home-btn" onclick="goHome()">返回首頁</button>
</div>

<!-- ══════ NO HEARTS SCREEN ══════ -->
<div id="screen-nohearts" class="screen">
  <div class="broken-heart">💔</div>
  <div class="nh-title">愛心用完了！</div>
  <div class="nh-sub">你的愛心已經用完了。<br>每隔一段時間愛心會自動補充，<br>或是直接返回首頁重整補滿！</div>
  <button class="refill-btn" onclick="refillHearts()">補充愛心 ❤️</button>
  <button class="home-btn" onclick="goHome()" style="background:var(--gray-200);color:var(--gray-700);box-shadow:0 4px 0 #aaa">返回首頁</button>
</div>

<script>
// ═══════════════════════════════════════
// LESSON DATA
// ═══════════════════════════════════════
const UNITS = [

    color: '#28A745',
    xpReward: 20,
    exercises: [
      {
        type: 'translate',
        prompt: '「你好嗎？」用英文怎麼說？',
        sub: '選擇正確的英文翻譯',
        correct: 1,

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const STATE = {
  hearts: 3,
  xp: 0,
  streak: 0,
  completedUnits: new Set(),
  unitProgress: {}, // { unitId: correctCount }
  lastPlayDate: null,
  // session
  currentUnitId: null,
  exerciseIndex: 0,
  selectedAnswer: null,
  arrangeSlots: [],   // words placed in slot
  checked: false,
  correct: 0,
  wrong: 0,
  startTime: 0,
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('englishgo_v1') || '{}');
    STATE.hearts = saved.hearts ?? 3;
    STATE.xp = saved.xp ?? 0;
    STATE.streak = saved.streak ?? 0;
    STATE.completedUnits = new Set(saved.completedUnits || []);
    STATE.unitProgress = saved.unitProgress || {};
    STATE.lastPlayDate = saved.lastPlayDate || null;
    // Streak logic: reset if more than 1 day gap
    const today = new Date().toDateString();
    if (STATE.lastPlayDate && STATE.lastPlayDate !== today) {
      const last = new Date(STATE.lastPlayDate);
      const now = new Date();
      const diffDays = Math.floor((now - last) / 86400000);
      if (diffDays > 1) STATE.streak = 0;
    }
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('englishgo_v1', JSON.stringify({
    hearts: STATE.hearts,
    xp: STATE.xp,
    streak: STATE.streak,
    completedUnits: [...STATE.completedUnits],
    unitProgress: STATE.unitProgress,
    lastPlayDate: new Date().toDateString(),
  }));
}

// ═══════════════════════════════════════
// SPEECH
// ═══════════════════════════════════════
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

// ═══════════════════════════════════════
// HOME
// ═══════════════════════════════════════
function renderHome() {
  loadState();
  document.getElementById('stat-streak').textContent = STATE.streak;
  document.getElementById('stat-xp').textContent = STATE.xp;
  const h = STATE.hearts;
  document.getElementById('stat-hearts').textContent = '❤️'.repeat(h) + '🖤'.repeat(Math.max(0, 3 - h));

  const body = document.getElementById('homeBody');
  body.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = '學習路線';
  body.appendChild(label);

  UNITS.forEach((unit, i) => {
    const unlocked = i === 0 || STATE.completedUnits.has(UNITS[i - 1].id);
    const done = STATE.completedUnits.has(unit.id);
    const progress = STATE.unitProgress[unit.id] || 0;
    const total = unit.exercises.length;
    const pct = done ? 100 : Math.round(progress / total * 100);

    const card = document.createElement('div');
    card.className = 'unit-card' + (unlocked ? '' : ' locked');
    card.innerHTML = `
      <div class="unit-header">
        <div class="unit-emoji" style="background:${unit.bg}">
          ${unlocked ? unit.emoji : '🔒'}
        </div>
        <div class="unit-info">
          <div class="unit-title">${unit.title}</div>
          <div class="unit-sub">${unit.subtitle}</div>
        </div>
        <span class="unit-badge ${done ? 'badge-done' : unlocked ? 'badge-new' : 'badge-lock'}">
          ${done ? '✓ 完成' : unlocked ? '進行中' : '🔒 鎖定'}
        </span>
      </div>
      <div class="unit-progress-bar">
        <div class="unit-progress-fill" style="width:${pct}%"></div>
      </div>
      ${unlocked ? `<button class="start-btn" onclick="startLesson('${unit.id}')">
        ${done ? '再練習一次' : progress > 0 ? '繼續學習' : '開始學習'} ⚡${unit.xpReward} XP
      </button>` : `<button class="start-btn" disabled>🔒 完成上一個課程以解鎖</button>`}
    `;
    body.appendChild(card);
  });
}

// ═══════════════════════════════════════
// LESSON
// ═══════════════════════════════════════
function startLesson(unitId) {
  if (STATE.hearts <= 0) {
    showScreen('screen-nohearts');
    return;
  }
  STATE.currentUnitId = unitId;
  STATE.exerciseIndex = 0;
  STATE.selectedAnswer = null;
  STATE.arrangeSlots = [];
  STATE.checked = false;
  STATE.correct = 0;
  STATE.wrong = 0;
  STATE.startTime = Date.now();

  showScreen('screen-lesson');
  renderExercise();
}

function getUnit() { return UNITS.find(u => u.id === STATE.currentUnitId); }
function getExercise() { return getUnit()?.exercises[STATE.exerciseIndex]; }

function renderExercise() {
  const unit = getUnit();
  const ex = getExercise();
  if (!ex) { completLesson(); return; }

  // Update progress bar
  const pct = (STATE.exerciseIndex / unit.exercises.length) * 100;
  document.getElementById('lessonProgress').style.width = pct + '%';

  // Hearts
  const h = STATE.hearts;
  document.getElementById('lessonHearts').textContent = '❤️'.repeat(h) + '🖤'.repeat(Math.max(0, 3 - h));

  // Reset feedback
  hideFeedback();
  document.getElementById('checkArea').style.display = 'block';
  setCheckActive(false);

  STATE.selectedAnswer = null;
  STATE.arrangeSlots = [];
  STATE.checked = false;

  const wrap = document.getElementById('exerciseWrap');
  wrap.innerHTML = '';

  if (ex.type === 'translate') renderTranslate(ex, wrap);
  else if (ex.type === 'listen') renderListen(ex, wrap);
  else if (ex.type === 'arrange') renderArrange(ex, wrap);
}

// ── Translate exercise ──
function renderTranslate(ex, wrap) {
  wrap.innerHTML = `
    <div class="q-label">翻譯題</div>
    <div class="q-text">${ex.prompt}</div>
    ${ex.sub ? `<div class="q-sub">${ex.sub}</div>` : ''}
    <div class="options-grid" id="optGrid">
      ${ex.options.map((o, i) => `
        <button class="option-btn" id="opt${i}" onclick="selectOption(${i})">
          <span class="opt-emoji">${o.emoji}</span>
          <span class="opt-text">${o.text}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function selectOption(i) {
  if (STATE.checked) return;
  const ex = getExercise();
  document.querySelectorAll('.option-btn').forEach((b, idx) => {
    b.classList.toggle('selected', idx === i);
  });
  STATE.selectedAnswer = i;
  setCheckActive(true);
}

// ── Listen exercise ──
function renderListen(ex, wrap) {
  wrap.innerHTML = `
    <div class="q-label">聽力題</div>
    <div class="q-text">${ex.prompt}</div>
    <div class="listen-card" onclick="speak('${ex.word}')">
      <div class="listen-icon">🔊</div>
      <div class="listen-text">${ex.word}</div>
      <div class="listen-hint">${ex.pronunciation} &nbsp;—&nbsp; 點擊播放發音</div>
    </div>
    <div class="options-grid" id="optGrid">
      ${ex.options.map((o, i) => `
        <button class="option-btn" id="opt${i}" onclick="selectOption(${i})">
          <span class="opt-emoji">${o.emoji}</span>
          <span class="opt-text">${o.text}</span>
        </button>
      `).join('')}
    </div>
  `;
  speak(ex.word);
}

// ── Arrange exercise ──
function renderArrange(ex, wrap) {
  const shuffled = [...ex.words].sort(() => Math.random() - 0.5);

  wrap.innerHTML = `
    <div class="q-label">排列句子</div>
    <div class="q-text">${ex.prompt}</div>
    <div class="q-sub">${ex.sub}</div>
    <div class="sentence-slots" id="sentenceSlots">
      <span class="slot-placeholder" id="slotPlaceholder">在下方選擇單字...</span>
    </div>
    <div class="word-bank" id="wordBank">
      ${shuffled.map((w, i) => `
        <button class="word-chip" id="wchip${i}" data-word="${w}" data-idx="${i}" onclick="addWord(this)">
          ${w}
        </button>
      `).join('')}
    </div>
  `;
}

function addWord(btn) {
  if (STATE.checked) return;
  if (btn.classList.contains('used')) return;

  const word = btn.dataset.word;
  const idx = btn.dataset.idx;

  // Mark as used
  btn.classList.add('used');

  // Add to slots
  STATE.arrangeSlots.push({ word, chipIdx: idx });

  const slots = document.getElementById('sentenceSlots');
  document.getElementById('slotPlaceholder')?.remove();

  const chip = document.createElement('button');
  chip.className = 'word-chip in-slot';
  chip.textContent = word;
  chip.dataset.chipIdx = idx;
  chip.onclick = () => removeSlotWord(chip, idx);
  slots.appendChild(chip);

  setCheckActive(STATE.arrangeSlots.length > 0);
}

function removeSlotWord(chip, chipIdx) {
  if (STATE.checked) return;
  // Remove from slots array
  STATE.arrangeSlots = STATE.arrangeSlots.filter(s => s.chipIdx !== chipIdx);
  chip.remove();

  // Restore bank chip
  const bankChip = document.querySelector(`[data-idx="${chipIdx}"]`);
  if (bankChip) bankChip.classList.remove('used');

  // Show placeholder if empty
  const slots = document.getElementById('sentenceSlots');
  if (!slots.querySelector('.word-chip')) {
    const ph = document.createElement('span');
    ph.className = 'slot-placeholder';
    ph.id = 'slotPlaceholder';
    ph.textContent = '在下方選擇單字...';
    slots.appendChild(ph);
  }

  setCheckActive(STATE.arrangeSlots.length > 0);
}

// ═══════════════════════════════════════
// CHECK ANSWER
// ═══════════════════════════════════════
function checkAnswer() {
  if (STATE.checked) return;
  const ex = getExercise();
  if (!ex) return;

  let isCorrect = false;

  if (ex.type === 'translate' || ex.type === 'listen') {
    if (STATE.selectedAnswer === null) return;
    isCorrect = STATE.selectedAnswer === ex.correct;

    // Highlight options
    document.querySelectorAll('.option-btn').forEach((btn, i) => {
      btn.disabled = true;
      if (i === ex.correct) btn.classList.add('correct');
      else if (i === STATE.selectedAnswer && !isCorrect) btn.classList.add('wrong');
    });
  } else if (ex.type === 'arrange') {
    if (STATE.arrangeSlots.length === 0) return;
    const formed = STATE.arrangeSlots.map(s => s.word).join(' ');
    isCorrect = formed.toLowerCase() === ex.correctSentence.toLowerCase();

    // Highlight slot chips
    document.querySelectorAll('#sentenceSlots .word-chip').forEach(chip => {
      chip.classList.remove('in-slot');
      chip.classList.add(isCorrect ? 'correct' : 'wrong');
    });
    document.querySelectorAll('#wordBank .word-chip').forEach(chip => chip.disabled = true);
  }

  STATE.checked = true;
  document.getElementById('checkArea').style.display = 'none';

  if (isCorrect) {
    STATE.correct++;
    showFeedback(true, ex);
  } else {
    STATE.wrong++;
    STATE.hearts = Math.max(0, STATE.hearts - 1);
    document.getElementById('lessonHearts').textContent =
      '❤️'.repeat(STATE.hearts) + '🖤'.repeat(Math.max(0, 3 - STATE.hearts));

    // Shake exercise wrap
    const wrap = document.getElementById('exerciseWrap');
    wrap.classList.remove('shake');
    void wrap.offsetWidth;
    wrap.classList.add('shake');

    showFeedback(false, ex);

    if (STATE.hearts <= 0) {
      setTimeout(() => {
        saveState();
        showScreen('screen-nohearts');
      }, 1800);
      return;
    }
  }
}

function showFeedback(correct, ex) {
  const bar = document.getElementById('feedbackBar');
  bar.className = 'feedback-bar ' + (correct ? 'correct' : 'wrong');
  bar.style.display = 'flex';

  document.getElementById('fbIcon').textContent = correct ? '✅' : '❌';
  document.getElementById('fbTitle').textContent = correct ? '太棒了！' : '答錯了！';

  let sub = '';
  if (!correct) {
    if (ex.type === 'translate' || ex.type === 'listen') {
      sub = `正確答案：${ex.options[ex.correct].text}`;
    } else if (ex.type === 'arrange') {
      sub = `正確答案：${ex.correctSentence}`;
    }
  } else {
    const phrases = ['做得好！', '繼續保持！', '你真厲害！', '完美！'];
    sub = phrases[Math.floor(Math.random() * phrases.length)];
  }
  document.getElementById('fbSub').textContent = sub;
}

function hideFeedback() {
  const bar = document.getElementById('feedbackBar');
  bar.style.display = 'none';
  bar.className = 'feedback-bar';
}

function nextExercise() {
  STATE.exerciseIndex++;
  const unit = getUnit();
  if (STATE.exerciseIndex >= unit.exercises.length) {
    completLesson();
  } else {
    renderExercise();
  }
}

function setCheckActive(active) {
  const btn = document.getElementById('checkBtn');
  btn.className = 'check-btn ' + (active ? 'active' : 'inactive');
}

// ═══════════════════════════════════════
// COMPLETE
// ═══════════════════════════════════════
function completLesson() {
  const unit = getUnit();
  const elapsed = Math.round((Date.now() - STATE.startTime) / 1000);
  const total = STATE.correct + STATE.wrong;
  const acc = total ? Math.round(STATE.correct / total * 100) : 0;

  // Bonus XP for accuracy
  const xpEarned = Math.round(unit.xpReward * (acc / 100));
  STATE.xp += xpEarned;
  STATE.completedUnits.add(unit.id);
  STATE.unitProgress[unit.id] = unit.exercises.length;

  // Streak
  const today = new Date().toDateString();
  if (STATE.lastPlayDate !== today) {
    STATE.streak++;
    STATE.lastPlayDate = today;
  }

  saveState();

  // Update complete screen
  document.getElementById('completeSub').textContent = `你完成了「${unit.title}」！`;
  document.getElementById('xpGained').textContent = `+${xpEarned} XP`;
  document.getElementById('statAcc').textContent = acc + '%';
  document.getElementById('statTime').textContent = formatTime(elapsed);
  document.getElementById('statXP').textContent = xpEarned;

  showScreen('screen-complete');
  fireConfetti();
}

function formatTime(secs) {
  if (secs < 60) return secs + 's';
  return Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';
}

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  window.speechSynthesis?.cancel();
  renderHome();
  showScreen('screen-home');
}

function refillHearts() {
  STATE.hearts = 3;
  saveState();
  showScreen('screen-lesson');
  renderExercise();
}

// ═══════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════
function fireConfetti() {
  const colors = ['#58CC02','#1CB0F6','#FFC800','#FF4B4B','#CE82FF','#FF9600'];
  const container = document.createElement('div');
  container.className = 'confetti';
  document.body.appendChild(container);

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.cssText = `
      left: ${Math.random() * 100}vw;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width: ${6 + Math.random() * 10}px;
      height: ${6 + Math.random() * 10}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation-duration: ${1.5 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 0.8}s;
    `;
    container.appendChild(piece);
  }

  setTimeout(() => container.remove(), 4000);
}

// ═══════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════
document.addEventListener('keydown', e => {
  if (document.getElementById('screen-lesson').classList.contains('active')) {
    if (e.key === 'Enter') {
      if (!STATE.checked) checkAnswer();
      else nextExercise();
    }
    if (e.key === 'Escape') goHome();
  }
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
loadState();
renderHome();
</script>
</body>
</html>
